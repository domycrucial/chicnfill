<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- White Circular Emblem Base for Tab & Favicon -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" stroke="#F4B41A" stroke-width="12" />
  <circle cx="250" cy="250" r="228" fill="#FFFFFF" stroke="#141414" stroke-width="3" stroke-dasharray="8 6" opacity="0.25" />

  <!-- TOP: Serving Cloche / Food Dome -->
  <g stroke="#141414" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Knob -->
    <circle cx="250" cy="52" r="7" fill="#141414" />
    <!-- Dome Cover -->
    <path d="M 215 88 C 215 62, 285 62, 285 88 Z" fill="#141414" />
    <path d="M 210 88 C 210 52, 290 52, 290 88 Z" />
    <!-- Platter Base -->
    <line x1="200" y1="92" x2="300" y2="92" stroke-width="6" />
  </g>

  <!-- CENTER LOGO EMBLEM: Bird 'C' + Gold 'F' -->
  <g transform="translate(135, 115)">
    <!-- 'C' Chicken Bird (Matte Black) -->
    <polygon points="12,74 -10,64 8,52" fill="#141414" />
    <circle cx="68" cy="80" r="8" fill="#FFFFFF" />
    <circle cx="70" cy="80" r="4.5" fill="#141414" />
    <path
      d="M 108 28 C 62 28, 26 62, 26 108 C 26 154, 62 188, 108 188 L 108 158 C 80 158, 56 136, 56 108 C 56 80, 80 58, 108 58 Z"
      fill="#141414"
      stroke="#141414"
      stroke-width="3"
      stroke-linejoin="round"
    />

    <!-- 'F' Stylized Gold (Beveled) -->
    <g transform="translate(112, 22)">
      <!-- Main Stem Back Shadow -->
      <polygon points="14,5 106,5 88,40 40,40 12,178 -16,178" fill="#E59A0B" />
      <!-- Main Stem Front Light Facet -->
      <polygon points="17,5 108,5 92,36 46,36 18,178 6,178" fill="#F4B41A" />
      
      <!-- Middle Bar -->
      <polygon points="44,86 92,86 80,116 38,116" fill="#E59A0B" />
      <polygon points="46,86 93,86 82,112 40,112" fill="#F4B41A" />
      
      <!-- Top Bevel highlight -->
      <polygon points="14,5 108,5 98,18 26,18" fill="#FCD560" />
    </g>
  </g>

  <!-- BRAND NAME WORDMARK: CHIC-N-FILL -->
  <text x="250" y="355" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="42" letter-spacing="3" fill="#141414">
    CHIC<tspan fill="#F4B41A">-N-</tspan>FILL
  </text>

  <!-- BOTTOM: Pizza Slice -->
  <g transform="translate(250, 412)">
    <path d="M -32 26 Q 0 34 32 26 Q 0 20 -32 26 Z" fill="#F4B41A" stroke="#141414" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M 0 -36 L -30 22 Q 0 30 30 22 Z" fill="#FFFFFF" stroke="#141414" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Pepperoni Toppings -->
    <circle cx="-10" cy="-4" r="6" fill="#E59A0B" stroke="#141414" stroke-width="2.5" />
    <circle cx="10" cy="8" r="6.5" fill="#E59A0B" stroke="#141414" stroke-width="2.5" />
    <circle cx="4" cy="-18" r="4.5" fill="#E59A0B" stroke="#141414" stroke-width="2" />
  </g>
</svg>
